# Never include query strings, referrers or request headers in access logs.
log_format groven_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';
server {
    access_log /var/log/nginx/access.log groven_safe;
    listen 80;
    server_name groven.in *.groven.in;
    return 301 https://$host$request_uri;
}

server {
    access_log /var/log/nginx/access.log groven_safe;
    listen 443 ssl;
    server_name api.groven.in;

    ssl_certificate     /etc/letsencrypt/live/groven.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groven.in/privkey.pem;

    location /ws/ {
        # Only the non-secret workspace selector is supported. Reject old URLs
        # before contacting the upstream (including when the upstream is down).
        if ($args !~ "^tenant=[A-Za-z0-9_-]+$") { return 400; }
        proxy_pass http://daphne:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        gzip on;
        gzip_types text/plain application/json application/javascript text/xml;
        gzip_min_length 1000;
    }
}

server {
    access_log /var/log/nginx/access.log groven_safe;
    listen 443 ssl;
    server_name groven.in *.groven.in;

    ssl_certificate     /etc/letsencrypt/live/groven.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groven.in/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1000;

    root /usr/share/nginx/html;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.json {
        proxy_pass http://backend:8000/api/tenants/manifest.json$is_args$args;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_vary on;
        gzip_min_length 1000;
    }
}