<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#f6f7f4" />
  <script>
    // Set the preference before first paint to avoid a light flash on dark visits.
    (() => {
      let preference = 'system';
      try { preference = localStorage.getItem('groven-appearance') || 'system'; } catch { /* Storage is optional. */ }
      const dark = preference === 'dark' || (preference !== 'light' && preference !== 'dark' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#151515' : '#f6f7f4';
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Groven — Client requests, files, and delivery</title>
  <meta name="description" content="Manage client requests, share files, and review deliveries in a branded workspace for your agency or service team." />

  <!-- Open Graph / Facebook, LinkedIn, WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://groven.in/" />
  <meta property="og:title" content="Groven — Client requests, files, and delivery" />
  <meta property="og:description" content="Manage client requests, share files, and review deliveries in a branded workspace for your agency or service team." />
  <meta property="og:image" content="https://groven.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Groven" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://groven.in/" />
  <meta name="twitter:title" content="Groven — Client requests, files, and delivery" />
  <meta name="twitter:description" content="Manage client requests, share files, and review deliveries in a branded workspace for your agency or service team." />
  <meta name="twitter:image" content="https://groven.in/og-image.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
